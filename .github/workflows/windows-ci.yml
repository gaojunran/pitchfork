name: windows-ci

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build UI assets
        working-directory: ui
        run: |
          aube install
          aube run build
      - name: Build
        run: cargo build --all-features

      # Rust tests: nextest first (nice output, parallel), fall back to
      # cargo test if nextest is unavailable or compilation fails.
      - name: Run Rust tests (nextest)
        id: nextest
        run: cargo nextest run --all-features
        continue-on-error: true
      - name: Run Rust tests (cargo test fallback)
        if: steps.nextest.outcome != 'success'
        run: cargo test --all-features --no-fail-fast
        continue-on-error: true

      - name: Debug autostop hang
        shell: bash
        run: |
          export PATH="$PWD/target/debug:$PATH"
          export PITCHFORK_LOG=debug
          export PITCHFORK_AUTOSTOP_DELAY=5s
          export PITCHFORK_INTERVAL=2s
          export PITCHFORK_SHELL="sh -c"
          export PITCHFORK_STATE_DIR="$(mktemp -d /tmp/pf-debug-XXXXXX)"
          export PITCHFORK_LOGS_DIR="$PITCHFORK_STATE_DIR/logs"
          export HOME="$(mktemp -d)"
          mkdir -p "$PITCHFORK_LOGS_DIR"
          cat > pitchfork.toml <<'TOML'
          namespace = "project"

          [daemons.delayed_stop]
          run = "sleep 120"
          auto = ["stop"]
          ready_delay = 1
          TOML

          echo "=== 1. Start supervisor with debug ==="
          PITCHFORK_LOG=debug pitchfork supervisor start --force 2>&1
          echo "=== supervisor exit: $? ==="

          echo "=== 2. pitchfork cd --shell-pid \$\$ ==="
          timeout 10 pitchfork cd --shell-pid $$ 2>&1
          echo "=== cd exit: $? ==="

          echo "=== 3. pitchfork start delayed_stop --shell-pid \$\$ ==="
          timeout 10 pitchfork start delayed_stop --shell-pid $$ 2>&1
          echo "=== start exit: $? ==="

          echo "=== 4. wait_for_status ==="
          for i in $(seq 1 10); do
            if pitchfork status delayed_stop 2>/dev/null | grep -q "Status:.*running"; then
              echo "running after ${i} tries"
              break
            fi
            sleep 0.2
          done

          echo "=== 5. cd to other dir ==="
          other_dir="$(mktemp -d /tmp/pf-other-XXXXXX)"
          cd "$other_dir"
          timeout 10 pitchfork cd --shell-pid $$ 2>&1
          echo "=== cd exit: $? ==="

          echo "=== 6. sleep 12 (wait for autostop) ==="
          sleep 12

          echo "=== 7. check status ==="
          timeout 10 pitchfork status project/delayed_stop 2>&1
          echo "=== status exit: $? ==="

          echo "=== 8. supervisor stop ==="
          timeout 10 pitchfork supervisor stop 2>&1
          echo "=== stop exit: $? ==="

          echo "=== Supervisor log ==="
          cat "$PITCHFORK_LOGS_DIR/pitchfork/pitchfork.log" 2>&1 | tail -50
        continue-on-error: true

      # bats e2e tests: run under Git Bash (shell: bash). Many tests have
      # strong Unix dependencies (script(1), nc, /tmp, signal semantics)
      # so expect failures here — the goal is to see how far we get.
      # Run each .bats file separately with a 30s per-file timeout so a
      # hung file (Windows lacks POSIX signals for daemon cleanup) doesn't
      # block all other files.
      - name: Run bats e2e tests
        shell: bash
        run: |
          export PATH="$PWD/target/debug:$PATH"
          for f in test/*.bats; do
            echo "::group::$f"
            timeout 120 test/bats/bin/bats --tap "$f" 2>&1 || echo "::warning::$f failed or timed out"
            echo
            echo "::endgroup::"
          done
          exit 0
        continue-on-error: true
