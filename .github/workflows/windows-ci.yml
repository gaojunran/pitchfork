name: windows-ci

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install sqlite3
        shell: pwsh
        run: choco install sqlite -y --no-progress
      - name: Build UI assets
        working-directory: ui
        run: |
          aube install
          aube run build
      - name: Build
        run: cargo build --all-features

      # Rust tests: nextest first (nice output, parallel), fall back to
      # cargo test if nextest is unavailable or compilation fails.
      - name: Run Rust tests (nextest)
        id: nextest
        run: cargo nextest run --all-features
        continue-on-error: true
      - name: Run Rust tests (cargo test fallback)
        if: steps.nextest.outcome != 'success'
        run: cargo test --all-features --no-fail-fast
        continue-on-error: true

      # bats e2e tests: run under Git Bash (shell: bash), same as Linux CI.
      - name: Run bats e2e tests
        shell: bash
        run: |
          export PATH="$PWD/target/debug:$PATH"
          test/bats/bin/bats test
        continue-on-error: true
